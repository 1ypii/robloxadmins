name: sync data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: sync group roster
        run: node scripts/sync-group.mjs

      - name: sync avatars
        run: node scripts/sync-avatars.mjs

      - name: sync premium
        continue-on-error: true
        timeout-minutes: 30
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          if [ -n "$ROBLOX_API_KEY" ]; then
            node scripts/sync-plus.mjs
          else
            echo "no ROBLOX_API_KEY secret set skipping premium sweep"
          fi

      - name: sync admin badges
        run: node scripts/sync-admins.mjs

      - name: commit and push
        if: always()
        run: |
          git config user.name "zxaw"
          git config user.email "128241871+1ypii@users.noreply.github.com"
          git fetch origin main
          git reset origin/main
          git checkout origin/main -- data/staff.json
          git add data
          git diff --cached --quiet || (git commit --amend --allow-empty-message -m "" && git push --force)
